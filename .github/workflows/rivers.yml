name: Rivers and tributaries

# Builds the world's rivers and their larger tributaries, with names, from
# OpenStreetMap (as in OpenFreeMap's zoom-8 tiles) into rivers.pmtiles on the
# 'rivers' release, used offline by the apps. Run by hand, or monthly.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 12 * *'
  push:
    paths:
      - tools/build-osm-rivers.mjs
      - .github/workflows/rivers.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        run: |
          npm install --no-save @mapbox/vector-tile@2.0.3 pbf@4.0.1
          sudo apt-get update -q && sudo apt-get install -y -q build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4 >/dev/null
          sudo make -C /tmp/tippecanoe install >/dev/null
      - name: Read the rivers
        run: |
          node tools/build-osm-rivers.mjs > /tmp/rivers.geojsonl
          ls -lh /tmp/rivers.geojsonl
          head -c 300 /tmp/rivers.geojsonl
      - name: Make the map file
        run: |
          tippecanoe -o /tmp/rivers.pmtiles -l rivers -Z3 -z10 -P --no-tile-size-limit --no-feature-limit \
            --simplification=2 --force /tmp/rivers.geojsonl
          ls -lh /tmp/rivers.pmtiles
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rivers >/dev/null 2>&1 || \
            gh release create rivers --title "Rivers data" --target "${{ github.sha }}" \
              --notes "World rivers and tributaries with names from OpenStreetMap (ODbL), via OpenFreeMap tiles; used by the app builds. Not an app release."
          gh release upload rivers /tmp/rivers.pmtiles --clobber
      - name: Rebuild the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref "${{ github.ref_name }}"
          gh workflow run pages.yml --ref "${{ github.ref_name }}"
