name: Publish for iPhone

# The app is a static site: the repository root is the site. On the iPhone,
# open the published address in Safari and use Share → Add to Home Screen.
on:
  push:
    branches: [main, claude/next-port-app]
    paths-ignore:
      - 'android/**'
  # A commit made by the rates or coastline job does not start other workflows by itself,
  # so listen for that job finishing.
  workflow_run:
    workflows: ["Exchange rates", "Port coastlines"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # After those jobs, publish what it just committed.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js data fonts vendor icons _site/
          # A new version name makes phones fetch the new files.
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'wm-${GITHUB_SHA::8}'/" _site/sw.js
          grep -q "wm-${GITHUB_SHA::8}" _site/sw.js
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
