name: Publish for iPhone

# The app is a static site: the repository root is the site. On the iPhone,
# open the published address in Safari and use Share → Add to Home Screen.
on:
  push:
    branches: [main, claude/next-port-app]
    paths-ignore:
      - 'android/**'
  # A commit made by the rates or coastline job does not start other workflows by itself,
  # so listen for that job finishing.
  workflow_run:
    workflows: ["Exchange rates", "Port coastlines", "Gas terminals"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # After those jobs, publish what it just committed.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the scripts
        run: for f in js/*.js sw.js; do node --check "$f" || exit 1; done
      - name: Stage the site
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js data fonts vendor icons _site/
          # The world coastline file, kept on the 'world-coast' release.
          gh release download world-coast -p land.pmtiles -D _site/data || echo "No world coastline file yet"
          # The rivers and tributaries file.
          gh release download rivers -p rivers.pmtiles -D _site/data || echo "No rivers file yet"
          # A new version name makes phones fetch the new files.
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'wm-${GITHUB_SHA::8}'/" _site/sw.js
          grep -q "wm-${GITHUB_SHA::8}" _site/sw.js
          # GitHub Pages takes up to 1 GB. Nothing is left out: if this version
          # would not fit, it is not published, and the iPhone keeps the last
          # version that did (new features then go to the Android app only).
          size=$(du -sm _site | cut -f1)
          echo "Site: ${size} MB of 1000"
          if [ "$size" -gt 1000 ]; then
            echo "::warning::iPhone version full (${size} MB of 1 GB): not published; the iPhone keeps its current version. Android gets this change."
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          # Name the iPhone's coastline cache after this file, so pieces kept from
          # an older file are dropped rather than mixed with the new one.
          if [ -f _site/data/land.pmtiles ]; then
            id=$(sha256sum _site/data/land.pmtiles | cut -c1-12)
            sed -i "s/const WORLD_ID = '[^']*'/const WORLD_ID = '$id'/" _site/sw.js
            grep -q "WORLD_ID = '$id'" _site/sw.js
          fi
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.full != 'true'
        with:
          path: _site

      - id: deployment
        if: steps.stage.outputs.full != 'true'
        uses: actions/deploy-pages@v4
