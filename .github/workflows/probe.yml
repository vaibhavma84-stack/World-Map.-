name: Probe map tiles
on:
  workflow_dispatch:
  push:
    paths:
      - tools/probe-ofm.mjs
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @mapbox/vector-tile@2.0.3 pbf@4.0.1 && node tools/probe-ofm.mjs
