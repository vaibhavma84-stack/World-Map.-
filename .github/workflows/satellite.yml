name: Satellite imagery

# Sentinel-2 cloudless (EOX) for the whole world, zoom 0 to 7, kept on the
# 'satellite' release for the Android app. On changes to its script or from
# the Actions tab.
on:
  push:
    paths:
      - tools/build-satellite.py
      - .github/workflows/satellite.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: pip install pmtiles==3.4.1
      - run: python3 tools/build-satellite.py satellite.pmtiles 7 && ls -la satellite.pmtiles
      - name: Publish on the 'satellite' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view satellite >/dev/null 2>&1 || gh release create satellite --title "Satellite imagery" --notes "Sentinel-2 cloudless by EOX (https://s2maps.eu), zoom 0-7, for the Android app." --latest=false
          gh release upload satellite satellite.pmtiles --clobber
      - name: Rebuild the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref "${{ github.ref_name }}"
