name: Gas terminals

# Gathers LNG and LPG terminals near ports from Wikidata and OpenStreetMap
# into data/terminals.json. Runs monthly, or from the Actions tab when wanted.
on:
  schedule:
    - cron: '37 5 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: terminals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/fetch-terminals.mjs
      - name: Save if changed
        run: |
          git add data/terminals.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update LNG and LPG terminals"
          git pull --rebase -q
          git push

      # Builds started by this job's own push would not run on their own, so
      # start the Android and iPhone builds here once there is new data.
      - name: Rebuild the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && exit 0
          gh workflow run android.yml --ref "${{ github.ref_name }}"
          gh workflow run pages.yml --ref "${{ github.ref_name }}"
