name: Ocean depths

# Ocean depth bands (0, 200, 1000 … 10,000 m) from Natural Earth's 10m
# bathymetry (public domain) into data/bathymetry.pmtiles, for the sea's
# shades of blue, offline. On changes to this file or from the Actions tab.
on:
  push:
    paths:
      - .github/workflows/bathymetry.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4 >/dev/null
          sudo make -C /tmp/tippecanoe install >/dev/null
      - name: Natural Earth bathymetry
        run: |
          mkdir -p /tmp/bathy && cd /tmp/bathy
          curl -fsSL -A "Mozilla/5.0 (WorldMap build)" -o all.zip https://naciscdn.org/naturalearth/10m/physical/ne_10m_bathymetry_all.zip
          unzip -q all.zip
          ls
      - name: Depth bands
        run: |
          cd /tmp/bathy
          rm -f bands.geojsonl
          for f in $(find . -name 'ne_10m_bathymetry_*.shp' | sort); do
            d=$(basename "$f" .shp | sed -E 's/.*_([0-9]+)$/\1/')
            ogr2ogr -f GeoJSONSeq /vsistdout/ "$f" -t_srs EPSG:4326 -dialect sqlite -sql "SELECT geometry, $d AS d FROM \"$(basename "$f" .shp)\"" >> bands.geojsonl
            echo "$f -> $d m"
          done
          wc -l bands.geojsonl
          tippecanoe -o "$GITHUB_WORKSPACE/data/bathymetry.pmtiles" -l depth -Z0 -z7 --force \
            --coalesce-densest-as-needed --detect-shared-borders --simplification=4 \
            --no-tile-size-limit -P bands.geojsonl
          ls -la "$GITHUB_WORKSPACE/data/bathymetry.pmtiles"
          [ "$(stat -c %s "$GITHUB_WORKSPACE/data/bathymetry.pmtiles")" -lt 40000000 ] || { echo "Too big"; exit 1; }
      - name: Save
        run: |
          git add data/bathymetry.pmtiles
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ocean depths"
          git pull --rebase -q
          git push
      - name: Rebuild the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && exit 0
          gh workflow run android.yml --ref "${{ github.ref_name }}"
          gh workflow run pages.yml --ref "${{ github.ref_name }}"
