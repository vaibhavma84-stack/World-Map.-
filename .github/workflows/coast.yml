name: Port coastlines

# Cuts OpenStreetMap's detailed coastline round every port out of the world's
# land polygons (about 800 MB, from osmdata.openstreetmap.de), less inland
# water (rivers, channels, docks) from OpenFreeMap's tiles, into data/coast/.
# The coast changes slowly, and each run stores a fresh copy (about 300 MB)
# in the repository's history, so this runs only when asked.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: coast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: pip install shapely==2.2.0 pyogrio==0.13.0 mapbox-vector-tile==2.2.0 numpy

      # The inland-water tiles, kept between runs so a rerun asks for none.
      - uses: actions/cache@v4
        with:
          path: tools/.cache/water
          key: coast-water-${{ github.run_id }}
          restore-keys: coast-water-

      - name: Build
        run: python3 tools/build-coast.py

      - name: Save
        run: |
          du -sh data/coast
          git add -A data/coast
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update harbour coastlines from OpenStreetMap"
          git pull --rebase -q
          git push

      # Builds started by this job's own push would not run on their own, so
      # start the Android and iPhone builds here once there is new data.
      - name: Rebuild the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && exit 0
          gh workflow run android.yml --ref "${{ github.ref_name }}"
          gh workflow run pages.yml --ref "${{ github.ref_name }}"
