name: Port coastlines

# Cuts OpenStreetMap's detailed coastline round every port out of the world's
# land polygons (about 800 MB, from osmdata.openstreetmap.de) into data/coast/.
# The coast changes slowly, and each run stores a fresh copy (about 300 MB)
# in the repository's history, so this runs only when asked.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build-coast.py'
      - '.github/workflows/coast.yml'

permissions:
  contents: write

concurrency:
  group: coast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: pip install shapely==2.2.0 pyogrio==0.13.0

      - name: Build
        run: python3 tools/build-coast.py

      - name: Save
        run: |
          du -sh data/coast
          git add -A data/coast
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update harbour coastlines from OpenStreetMap"
          git pull --rebase -q
          git push
