name: Pilot boarding places

# Downloads every pilot boarding place mapped in OpenSeaMap into
# data/pilots.json. GitHub can reach the Overpass servers; the phone never
# needs to, as the file then travels inside the app.
on:
  schedule:
    - cron: '17 3 1 * *'   # monthly
  push:
    paths:
      - 'tools/fetch-pilots.mjs'
      - '.github/workflows/pilots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilots
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch
        run: node tools/fetch-pilots.mjs

      - name: Save if changed
        run: |
          git add data/pilots.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pilot boarding places from OpenSeaMap"
          git push
