<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>World Map</title>
  <meta name="description" content="Offline world map of every port, with local time, currency and particulars.">
  <meta name="theme-color" content="#b7d7ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="World Map">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="World map"></div>

  <header class="bar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search ports, LOCODE, countries" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="clear" class="icon" type="button" aria-label="Clear" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <button id="settings-btn" class="icon round" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <ul id="results" class="results" role="listbox" hidden></ul>

  <div class="tools">
    <button id="layers-btn" class="icon round" type="button" aria-label="Map layers" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button id="locate" class="icon round" type="button" aria-label="Show my position">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button id="world" class="icon round" type="button" aria-label="Whole world">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
    </button>
  </div>

  <div id="layers" class="layers" hidden>
    <label><input type="checkbox" data-layer="seamarks"> Sea chart marks <small>TSS, routes, lights, buoys · online</small></label>
    <label><input type="checkbox" data-layer="pilots"> Pilot boarding places</label>
    <label><input type="checkbox" data-layer="rivers"> Rivers and lakes</label>
    <label><input type="checkbox" data-layer="grid"> Latitude and longitude</label>
  </div>

  <div id="coords" class="coords" aria-live="off"></div>

  <section id="panel" class="panel" hidden aria-live="polite">
    <button class="grip" type="button" aria-label="Expand or shrink"></button>
    <button id="close" class="icon close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="panel-body"></div>
  </section>

  <dialog id="settings" class="sheet">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Home time zone
        <select id="home-tz"></select>
      </label>
      <label>Call home
        <input id="home-name" type="text" placeholder="Home" maxlength="24">
      </label>
      <label>Ship's clock
        <select id="ship-offset"></select>
      </label>
      <p class="hint">Set the ship's clock to the zone time kept on board, and the port card says how far to advance or retard.</p>
      <p class="hint small">Map: Natural Earth. Ports: NGA World Port Index (via seaport-data-js, CC BY 4.0) and UN/LOCODE. Not for navigation.</p>
      <div class="row-end"><button class="primary" value="ok">Done</button></div>
    </form>
  </dialog>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
